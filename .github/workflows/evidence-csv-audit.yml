name: Evidence CSV audit regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Run CSV audit regression tests
        run: python -m unittest discover -s lab/tests -p 'test_evidence_csv_audit.py' -v
      - name: Check Python syntax
        run: python -m py_compile lab/tools/evidence_csv_audit.py
      - name: Audit real synthetic authentication fixture
        run: python lab/tools/evidence_csv_audit.py lab/auth_events.csv --required event_id timestamp username src_ip action geo --unique event_id
