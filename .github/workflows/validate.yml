name: Validate SOC investigations and synthetic evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-soc:
    name: SOC replay and independent PCAP (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out source without cached credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-verification.txt
      - name: Install independent packet decoder
        run: python -m pip install -r requirements-verification.txt
      - name: Validate source syntax and read-only Bash audit script
        run: |
          python -m compileall -q lab tests 'System & Automation/python'
          bash -n 'System & Automation/bash/linux_security_audit.sh'
      - name: Replay detections, validate SQL and verify independently decoded PCAP
        run: python -m lab.reproduce --with-independent-pcap
      - name: Confirm evidence manifest records independent verification and test status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=Path('evidence')
          m=json.loads((r/'manifest.json').read_text())
          a=json.loads((r/'alerts.json').read_text())
          p=json.loads((r/'network/independent_verification.json').read_text())
          b=json.loads((r/'benchmark/scenario_results.json').read_text())
          assert (m['events'],m['alerts'],m['sql_correlations'],m['tests_exit_code'])==(23,4,1,0),m
          assert len(a)==4 and len({x['alert_id'] for x in a})==4
          assert 'Passed:' in m['independent_pcap_verification']
          assert p['packet_count']==13 and p['ip_checksums_valid'] and p['tcp_checksums_valid']
          assert b['cases']==72 and b['passed']==72
          assert all(c['passed'] for c in b['results'])
          print('PASS: synthetic event, alert, SQL, PCAP and labeled-scenario evidence contracts')
          PY
      - name: Preserve investigation evidence for reviewer
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: soc-investigation-python-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/alerts.json
            evidence/sql_correlation.json
            evidence/test_results.txt
            evidence/manifest.json
            evidence/endpoint/alerts.json
            evidence/network/findings.json
            evidence/network/independent_verification.json
            evidence/benchmark/scenario_results.json
            demo/soc-investigation.html

  secrets:
    name: Scan full reachable Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out all history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download and verify Gitleaks binary
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          echo 'fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
      - name: Scan historical source for accidental credentials (fail on findings)
        run: |
          set +e
          /tmp/gitleaks git --config .gitleaks.toml --no-banner --redact --report-format json --report-path /tmp/gitleaks-report.json .
          status=$?
          set -e
          if [ -f /tmp/gitleaks-report.json ]; then
            python scripts/summarize_gitleaks.py /tmp/gitleaks-report.json
          fi
          exit "$status"
